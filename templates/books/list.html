<title> Books page</title>
<h1>Books      </h1>
    {% if messages %} 
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
<ul>
    {% for book in books %}
        <li>
            <a href="{% url 'books:detail' id=book.id %}">{{ book.title }}</a>

        </li>
    {% endfor %}       
</ul>
